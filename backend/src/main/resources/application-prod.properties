spring.application.name=Fitness-Management-System
# --- CONFIG IMPORT ---
spring.config.import=optional:file:./env/.env.prod[.properties],optional:file:./backend/env/.env.prod[.properties],optional:file:./.env.prod[.properties]
# --- SERVER ---
server.port=${PORT:8080}
# --- DATABASE ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitness_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# --- REDIS ---
spring.data.redis.repositories.enabled=false
# --- JPA (PRODUCTION SAFE) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# --- SECURITY (JWT) ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
# --- OAUTH2 (GOOGLE LOGIN) ---
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# --- OAUTH2 (GITHUB LOGIN) ---
spring.security.oauth2.client.registration.github.client-name=GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# --- OAUTH2 REDIRECT ---
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI}
# --- CORS ---
app.cors.allowed-origins=${ALLOWED_ORIGINS}
# --- ACTUATOR ---
management.endpoints.web.exposure.include=health,info
# --- HIKARI ---
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.devtools.add-properties=false
