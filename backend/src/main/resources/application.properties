spring.application.name=Fitness-Management-System
# --- CONFIG IMPORT ---
spring.config.import=optional:file:./env/.env.dev[.properties],optional:file:./backend/env/.env.dev[.properties],optional:file:./.env[.properties]
spring.profiles.default=${SPRING_PROFILES_DEFAULT:dev}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fitness_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false
spring.cache.type=redis
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80}
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:4200/oauth2/redirect}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=Fitness Management System
info.app.description=Enterprise Fitness Tracking REST API
info.app.version=1.0.0
# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# ─────────────────────────────────────────────────────────────
#  Email (Spring Mail + Thymeleaf)
#  Set SMTP_HOST / SMTP_USERNAME / SMTP_PASSWORD in your .env
# ─────────────────────────────────────────────────────────────
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:noreply@fitness.app}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Fail gracefully if no SMTP credentials are configured (dev mode)
spring.mail.test-connection=false

# Local dev should not report DOWN when optional integrations are absent.
management.health.mail.enabled=false
management.health.redis.enabled=false

# App branding (used in email templates)
app.name=${APP_NAME:Fitness Management System}

# Async thread pool for email dispatch
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=email-

# Logging defaults (clean and production-friendly)
debug=false
trace=false
logging.level.root=INFO
logging.level.com.project.fitness=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLogger=INFO
logging.level.org.springframework.boot.availability=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.boot.devtools=INFO

# ─────────────────────────────────────────────────────────────
#  Stripe Payment Gateway (Test Mode)
#  Get your keys from: https://dashboard.stripe.com/test/apikeys
# ─────────────────────────────────────────────────────────────
# Test secret key  (starts with sk_test_...)
stripe.secret.key=${STRIPE_SECRET_KEY:}
# Test publishable key (starts with pk_test_...) – sent to frontend
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:}
# Webhook signing secret (whsec_...)  – from Stripe CLI or dashboard
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
