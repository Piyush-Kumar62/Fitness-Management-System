<section
  id="hero"
  class="scroll-mt-24 pt-28 pb-12 lg:min-h-[calc(100vh-4rem)] flex items-center overflow-hidden"
>
  <div class="max-w-[1400px] w-full mx-auto px-4 sm:px-6 lg:px-8 xl:px-12">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-12 xl:gap-16 items-center">
      <div class="lg:col-span-6 xl:col-span-6 flex flex-col justify-center">
        <div class="mb-9 lg:mb-10">
          <span
            class="inline-flex items-center gap-2 mb-6 text-[0.65rem] sm:text-[0.72rem] font-bold tracking-[0.1em] text-emerald-100 bg-emerald-500/15 border border-emerald-300/40 px-4 py-1.5 rounded-full uppercase shadow-sm"
          >
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-300 animate-pulse"></span>
            Built For Members
          </span>
          <h1
            class="text-3xl sm:text-4xl lg:text-5xl xl:text-[3.55rem] font-extrabold leading-[1.15] tracking-tight text-white mb-6"
          >
            Your
            <span
              class="block text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 via-cyan-300 to-lime-300 pb-1 mt-1"
            >
              Fitness Journey
            </span>
            In One Place
          </h1>
          <p class="text-base sm:text-lg text-slate-200 leading-relaxed font-medium max-w-xl">
            Book classes, follow guided plans, track your progress, and manage your memberships from a single
            high-performance dashboard.
          </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-4 max-w-2xl mb-7">
          @for (stat of quickStats; track stat.label) {
            <app-stats-card [value]="stat.value" [label]="stat.label" [note]="stat.note"></app-stats-card>
          }
        </div>

        <div class="flex flex-col sm:flex-row flex-wrap gap-4">
          <app-landing-button variant="primary" (onClick)="router.navigate(['/auth/register'])">
            Join As Member
          </app-landing-button>

          <app-landing-button variant="secondary" (onClick)="router.navigate(['/auth/login'])">
            Login
          </app-landing-button>

          <app-landing-button variant="outline" (onClick)="scrollToFeatures()">
            See Member Features
          </app-landing-button>
        </div>
      </div>

      <div class="lg:col-span-6 xl:col-span-6 w-full relative group mt-10 lg:mt-0 flex items-center justify-center">
        <div
          class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80%] h-[80%] bg-emerald-400/10 rounded-full blur-[120px] pointer-events-none z-0"
        ></div>
        <div
          class="absolute top-1/2 left-1/2 translate-x-1/4 -translate-y-1/4 w-[60%] h-[60%] bg-cyan-400/10 rounded-full blur-[120px] pointer-events-none z-0"
        ></div>

        <div class="w-full floating-soft">
          <img
            src="/assets/images/hero-float.png"
            alt="Gym Management Platform Mockup"
            class="w-full h-auto max-h-[600px] xl:max-h-[700px] object-contain drop-shadow-2xl"
            loading="lazy"
            decoding="async"
          />
        </div>
      </div>
    </div>
  </div>
</section>
