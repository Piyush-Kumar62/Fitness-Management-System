<section id="roles" class="landing-section scroll-mt-24">
  <div class="landing-container">
    <div class="landing-head">
      <span class="landing-chip">Member Experience</span>
      <h2 class="landing-title">Your Fitness Workflow</h2>
      <p class="landing-subtitle max-w-3xl mx-auto">
        Everything members need from sign-up to long-term progress.
      </p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5">
      @for (role of roles; track role.title) {
        <article class="landing-card landing-card-interactive p-6 sm:p-7 rounded-[1.5rem] group">
          <div class="relative h-52 mb-6 rounded-2xl overflow-hidden">
            <img
              [src]="role.image"
              [alt]="role.title"
              class="absolute inset-0 w-full h-full object-cover group-hover:scale-110 transition-transform duration-700"
              loading="lazy"
            />
            <div
              class="absolute inset-0 bg-[linear-gradient(180deg,rgba(2,6,23,0.2)_0%,rgba(2,6,23,0.84)_100%)]"
            ></div>
            <div
              class="absolute bottom-4 left-4 h-10 w-10 rounded-full bg-emerald-400/20 backdrop-blur-md border border-emerald-300/50 flex items-center justify-center"
            >
              <svg
                class="w-5 h-5 text-emerald-100"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  [attr.d]="role.iconPath"
                />
              </svg>
            </div>
          </div>
          <p class="text-[0.68rem] tracking-[0.14em] uppercase text-cyan-100">Member Flow</p>
          <h3 class="text-2xl font-bold text-white mt-2">{{ role.title }}</h3>
          <p class="text-gray-300 text-base mt-3 leading-relaxed">{{ role.description }}</p>
          <ul class="mt-5 space-y-2.5 text-sm text-gray-200">
            @for (benefit of role.benefits; track benefit) {
              <li class="flex items-center gap-2.5">
                <span class="h-2 w-2 rounded-full bg-emerald-300"></span>
                <span>{{ benefit }}</span>
              </li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
