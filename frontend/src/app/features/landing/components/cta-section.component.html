<section id="cta" class="landing-section scroll-mt-24">
  <div class="landing-container">
    <div
      class="text-center bg-gradient-to-br from-slate-50 via-slate-100 to-slate-200/50 dark:from-indigo-950/30 dark:via-violet-950/25 dark:to-pink-950/25 border border-slate-200 dark:border-white/10 rounded-[2rem] p-8 md:p-12 lg:p-14 relative overflow-hidden shadow-xl"
    >
      <div class="absolute inset-0 bg-white/5 backdrop-blur-[2px]"></div>
      <div class="absolute -top-24 -left-24 w-96 h-96 bg-indigo-500/5 dark:bg-indigo-500/10 rounded-full blur-3xl"></div>
      <div
        class="absolute -bottom-24 -right-24 w-96 h-96 bg-pink-500/5 dark:bg-pink-500/10 rounded-full blur-3xl"
      ></div>

      

      <div class="relative z-10 max-w-3xl mx-auto">
        <span class="landing-chip">Ready To Start</span>
        <h2 class="landing-title !text-3xl sm:!text-4xl !font-extrabold !leading-tight !text-transparent bg-clip-text bg-gradient-to-r from-emerald-600 via-cyan-600 to-lime-600 dark:from-emerald-300 dark:via-cyan-300 dark:to-lime-300 pb-1">
          Start Your Member Journey Today
        </h2>
        <p class="landing-subtitle text-base sm:text-lg mt-4 max-w-2xl mx-auto !text-slate-600 dark:!text-slate-200">
          Join, choose your plan, and begin tracking workouts, classes, and progress from one app.
        </p>
        <div class="mt-7 flex flex-col sm:flex-row justify-center items-center gap-3">
          <button
            (click)="router.navigate(['/auth/register'])"
            class="landing-btn-primary px-7 py-3 text-base w-full sm:w-auto shadow-lg shadow-pink-500/25"
          >
            Create Member Account
          </button>
          <button
            (click)="scrollToContact()"
            class="landing-btn-secondary px-7 py-3 text-base w-full sm:w-auto border border-slate-300 dark:border-white/20 bg-slate-100 dark:bg-white/5 hover:bg-slate-200 dark:hover:bg-white/10 text-slate-800 dark:text-white"
          >
            Talk To Support
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
