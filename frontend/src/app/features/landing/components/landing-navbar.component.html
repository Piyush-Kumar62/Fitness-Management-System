<nav
  class="fixed top-0 w-full z-50 border-b border-slate-200 dark:border-emerald-200/15 bg-white/80 dark:bg-[linear-gradient(180deg,rgba(2,6,23,0.92)_0%,rgba(2,6,23,0.72)_100%)] backdrop-blur-xl"
>
  <div class="landing-container px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16 sm:h-[4.45rem]">
      <button
        class="flex items-center gap-3 rounded-full pl-2 pr-3 py-2 border border-transparent hover:border-emerald-300/30 hover:bg-emerald-300/10 transition-all duration-300"
        (click)="scrollTo('hero')"
      >
        <span
          class="inline-flex w-9 h-9 sm:w-10 sm:h-10 rounded-full items-center justify-center bg-gradient-to-br from-emerald-300 via-cyan-300 to-lime-300 text-slate-950 shadow-[0_10px_24px_-14px_rgba(16,185,129,0.95)]"
        >
          <svg class="w-5 h-5 sm:w-5.5 sm:h-5.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.3"
              d="M13 10V3L4 14h7v7l9-11h-7z"
            />
          </svg>
        </span>
        <span class="text-sm sm:text-base lg:text-[1.08rem] font-semibold text-slate-900 dark:text-white tracking-wide">
          {{ content.brand.logoText }}
        </span>
        <span class="hidden 2xl:inline-flex items-center gap-1.5 text-[0.65rem] uppercase tracking-[0.13em] text-emerald-100/90 border border-emerald-200/25 bg-emerald-300/10 px-2 py-1 rounded-full">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-300 animate-pulse"></span>
          Live Classes
        </span>
      </button>

      <div class="hidden xl:flex items-center gap-2 text-sm text-slate-700 dark:text-gray-100">
        <button
          class="px-4 py-2 rounded-full border border-slate-300 dark:border-emerald-200/20 bg-slate-50 dark:bg-white/[0.03] hover:bg-slate-200 dark:hover:bg-emerald-300/15 hover:border-slate-400 dark:hover:border-emerald-200/45 hover:text-slate-900 dark:hover:text-white transition-all duration-300"
          (click)="scrollTo('hero')"
        >
          Home
        </button>
        <button
          class="px-4 py-2 rounded-full border border-slate-300 dark:border-emerald-200/20 bg-slate-50 dark:bg-white/[0.03] hover:bg-slate-200 dark:hover:bg-emerald-300/15 hover:border-slate-400 dark:hover:border-emerald-200/45 hover:text-slate-900 dark:hover:text-white transition-all duration-300"
          (click)="scrollTo('roles')"
        >
          Features
        </button>
        <button
          class="px-4 py-2 rounded-full border border-slate-300 dark:border-emerald-200/20 bg-slate-50 dark:bg-white/[0.03] hover:bg-slate-200 dark:hover:bg-emerald-300/15 hover:border-slate-400 dark:hover:border-emerald-200/45 hover:text-slate-900 dark:hover:text-white transition-all duration-300"
          (click)="scrollTo('how-it-works')"
        >
          How It Works
        </button>
        <button
          class="px-4 py-2 rounded-full border border-slate-300 dark:border-emerald-200/20 bg-slate-50 dark:bg-white/[0.03] hover:bg-slate-200 dark:hover:bg-emerald-300/15 hover:border-slate-400 dark:hover:border-emerald-200/45 hover:text-slate-900 dark:hover:text-white transition-all duration-300"
          (click)="scrollTo('subscription')"
        >
          Pricing
        </button>
        <button
          class="px-4 py-2 rounded-full border border-slate-300 dark:border-emerald-200/20 bg-slate-50 dark:bg-white/[0.03] hover:bg-slate-200 dark:hover:bg-emerald-300/15 hover:border-slate-400 dark:hover:border-emerald-200/45 hover:text-slate-900 dark:hover:text-white transition-all duration-300"
          (click)="scrollTo('contact')"
        >
          Contact
        </button>
      </div>

      <div class="hidden xl:flex gap-2 items-center">
        <button
          (click)="router.navigate(['/auth/login'])"
          class="px-5 py-2 text-slate-900 dark:text-white border border-slate-300 dark:border-emerald-200/45 rounded-full hover:bg-slate-100 dark:hover:bg-emerald-300/15 transition-all duration-200"
        >
          Login
        </button>
        <button
          (click)="router.navigate(['/auth/register'])"
          class="px-5 py-2 text-slate-950 bg-gradient-to-r from-emerald-300 via-cyan-300 to-lime-300 rounded-full hover:brightness-105 transition-all duration-200 font-semibold shadow-[0_14px_28px_-16px_rgba(16,185,129,0.95)]"
        >
          Get Started
        </button>

        <!-- Theme Toggle -->
        <button
          (click)="onToggleTheme()"
          class="p-2 ml-2 rounded-full hover:bg-slate-200 dark:hover:bg-white/10 transition-colors"
          aria-label="Toggle theme"
        >
          @if (isDarkMode()) {
            <svg class="w-5 h-5 text-yellow-300" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd" />
            </svg>
          } @else {
            <svg class="w-5 h-5 text-slate-800" fill="currentColor" viewBox="0 0 20 20">
              <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
            </svg>
          }
        </button>
      </div>

      <button
        type="button"
        class="xl:hidden text-slate-900 dark:text-white border border-slate-300 dark:border-emerald-200/35 rounded-full px-4 py-2 hover:bg-slate-100 dark:hover:bg-emerald-300/10 transition"
        (click)="mobileMenuOpen = !mobileMenuOpen"
      >
        {{ mobileMenuOpen ? 'Close' : 'Menu' }}
      </button>
    </div>

    @if (mobileMenuOpen) {
      <div class="xl:hidden pb-4 text-sm text-gray-100">
        <div class="grid grid-cols-2 gap-2">
          <button
            class="block w-full text-left px-3 py-2 rounded-full border border-emerald-200/20 bg-white/[0.03] hover:bg-emerald-300/15 hover:text-white transition"
            (click)="scrollTo('hero')"
          >
            Home
          </button>
          <button
            class="block w-full text-left px-3 py-2 rounded-full border border-emerald-200/20 bg-white/[0.03] hover:bg-emerald-300/15 hover:text-white transition"
            (click)="scrollTo('roles')"
          >
            Features
          </button>
          <button
            class="block w-full text-left px-3 py-2 rounded-full border border-emerald-200/20 bg-white/[0.03] hover:bg-emerald-300/15 hover:text-white transition"
            (click)="scrollTo('how-it-works')"
          >
            How It Works
          </button>
          <button
            class="block w-full text-left px-3 py-2 rounded-full border border-emerald-200/20 bg-white/[0.03] hover:bg-emerald-300/15 hover:text-white transition"
            (click)="scrollTo('subscription')"
          >
            Pricing
          </button>
          <button
            class="block w-full text-left px-3 py-2 rounded-full border border-emerald-200/20 bg-white/[0.03] hover:bg-emerald-300/15 hover:text-white transition col-span-2"
            (click)="scrollTo('contact')"
          >
            Contact
          </button>
        </div>
        <div class="pt-2 flex gap-2">
          <button
            (click)="router.navigate(['/auth/login'])"
            class="flex-1 px-4 py-2 text-white border border-emerald-200/45 rounded-full hover:bg-emerald-300/15 transition"
          >
            Login
          </button>
          <button
            (click)="router.navigate(['/auth/register'])"
            class="flex-1 px-4 py-2 text-slate-950 bg-gradient-to-r from-emerald-300 via-cyan-300 to-lime-300 rounded-full hover:brightness-105 transition font-semibold shadow-[0_14px_28px_-16px_rgba(16,185,129,0.95)]"
          >
            Get Started
          </button>
        </div>
      </div>
    }
  </div>
</nav>
