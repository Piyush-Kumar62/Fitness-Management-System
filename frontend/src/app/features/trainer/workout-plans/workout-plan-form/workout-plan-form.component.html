<div class="container mx-auto max-w-3xl">
  <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">
    {{ isEditMode() ? 'Edit Workout Plan' : 'Create Workout Plan' }}
  </h1>

  <form [formGroup]="planForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
      <!-- Plan Details -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Title</label>
          <input
            formControlName="title"
            type="text"
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
            placeholder="e.g., Full Body Strength Training"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300"
            >Description</label
          >
          <textarea
            formControlName="description"
            rows="3"
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
            placeholder="Describe the workout plan..."
          ></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300"
              >Difficulty</label
            >
            <select
              formControlName="difficulty"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
            >
              <option value="BEGINNER">Beginner</option>
              <option value="INTERMEDIATE">Intermediate</option>
              <option value="ADVANCED">Advanced</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300"
              >Duration (weeks)</label
            >
            <input
              formControlName="durationWeeks"
              type="number"
              min="1"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Exercises Section -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Exercises</h2>
        <button
          type="button"
          (click)="addExercise()"
          class="bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700"
        >
          + Add Exercise
        </button>
      </div>

      @for (exercise of exercises.controls; track $index; let i = $index) {
        <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4 mb-4">
          <div class="flex justify-between items-center mb-3">
            <span class="font-medium text-gray-700 dark:text-gray-300">Exercise {{ i + 1 }}</span>
            <button
              type="button"
              (click)="removeExercise(i)"
              class="text-red-600 hover:text-red-500 text-sm"
            >
              Remove
            </button>
          </div>
          <div [formGroupName]="i" class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="col-span-2">
              <input
                formControlName="name"
                type="text"
                placeholder="Exercise name"
                class="w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
              />
            </div>
            <div>
              <input
                formControlName="sets"
                type="number"
                placeholder="Sets"
                min="1"
                class="w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
              />
            </div>
            <div>
              <input
                formControlName="reps"
                type="number"
                placeholder="Reps"
                min="1"
                class="w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
              />
            </div>
            <div>
              <input
                formControlName="duration"
                type="number"
                placeholder="Duration (min)"
                class="w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
              />
            </div>
            <div>
              <select
                formControlName="day"
                class="w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
              >
                <option value="MONDAY">Monday</option>
                <option value="TUESDAY">Tuesday</option>
                <option value="WEDNESDAY">Wednesday</option>
                <option value="THURSDAY">Thursday</option>
                <option value="FRIDAY">Friday</option>
                <option value="SATURDAY">Saturday</option>
                <option value="SUNDAY">Sunday</option>
              </select>
            </div>
            <div>
              <input
                formControlName="restSeconds"
                type="number"
                placeholder="Rest (sec)"
                class="w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
              />
            </div>
          </div>
        </div>
      }

      @if (exercises.length === 0) {
        <p class="text-gray-500 text-center py-4">
          No exercises added yet. Click "+ Add Exercise" to start.
        </p>
      }
    </div>

    <!-- Form Actions -->
    <div class="flex justify-end space-x-4">
      <button
        type="button"
        (click)="onCancel()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="planForm.invalid || isSubmitting()"
        class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 disabled:opacity-50"
      >
        {{ isSubmitting() ? 'Saving...' : isEditMode() ? 'Update Plan' : 'Create Plan' }}
      </button>
    </div>
  </form>
</div>
