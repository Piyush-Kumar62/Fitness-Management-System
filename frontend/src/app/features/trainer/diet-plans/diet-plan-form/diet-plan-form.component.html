<div class="container mx-auto max-w-3xl">
  <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">
    {{ isEditMode() ? 'Edit Diet Plan' : 'Create Diet Plan' }}
  </h1>

  <form [formGroup]="planForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Title</label>
          <input
            formControlName="title"
            type="text"
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
            placeholder="e.g., High Protein Diet Plan"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300"
            >Description</label
          >
          <textarea
            formControlName="description"
            rows="3"
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
            placeholder="Describe the diet plan..."
          ></textarea>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300"
              >Daily Calories</label
            >
            <input
              formControlName="calories"
              type="number"
              min="500"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300"
              >Protein (g)</label
            >
            <input
              formControlName="protein"
              type="number"
              min="0"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300"
              >Carbs (g)</label
            >
            <input
              formControlName="carbs"
              type="number"
              min="0"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300"
              >Fat (g)</label
            >
            <input
              formControlName="fat"
              type="number"
              min="0"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Meals Section -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Meals</h2>
        <button
          type="button"
          (click)="addMeal()"
          class="bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700"
        >
          + Add Meal
        </button>
      </div>

      @for (meal of meals.controls; track $index; let i = $index) {
        <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4 mb-4">
          <div class="flex justify-between items-center mb-3">
            <span class="font-medium text-gray-700 dark:text-gray-300">Meal {{ i + 1 }}</span>
            <button
              type="button"
              (click)="removeMeal(i)"
              class="text-red-600 hover:text-red-500 text-sm"
            >
              Remove
            </button>
          </div>
          <div [formGroupName]="i" class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div>
              <select
                formControlName="mealType"
                class="w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
              >
                <option value="BREAKFAST">Breakfast</option>
                <option value="LUNCH">Lunch</option>
                <option value="DINNER">Dinner</option>
                <option value="SNACK">Snack</option>
              </select>
            </div>
            <div>
              <input
                formControlName="name"
                type="text"
                placeholder="Meal name"
                class="w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
              />
            </div>
            <div>
              <input
                formControlName="calories"
                type="number"
                placeholder="Calories"
                class="w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
              />
            </div>
            <div>
              <input
                formControlName="description"
                type="text"
                placeholder="Description"
                class="w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
              />
            </div>
          </div>
        </div>
      }

      @if (meals.length === 0) {
        <p class="text-gray-500 text-center py-4">
          No meals added yet. Click "+ Add Meal" to start.
        </p>
      }
    </div>

    <div class="flex justify-end space-x-4">
      <button
        type="button"
        (click)="onCancel()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="planForm.invalid || isSubmitting()"
        class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 disabled:opacity-50"
      >
        {{ isSubmitting() ? 'Saving...' : isEditMode() ? 'Update Plan' : 'Create Plan' }}
      </button>
    </div>
  </form>
</div>
