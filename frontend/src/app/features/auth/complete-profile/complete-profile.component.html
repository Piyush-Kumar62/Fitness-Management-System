<section class="min-h-[70vh] flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-3xl bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8">
    <div class="mb-6">
      <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Complete Your Profile</h1>
      <p class="text-gray-600 dark:text-gray-400 mt-2">
        Select your role to finish onboarding. Your account will stay pending until admin approval.
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      @for (role of availableRoles; track role.value) {
        <button
          type="button"
          (click)="chooseRole(role.value)"
          class="text-left border-2 rounded-lg p-4 transition-colors"
          [class.border-indigo-600]="selectedRole() === role.value"
          [class.bg-indigo-50]="selectedRole() === role.value"
          [class.dark:bg-indigo-900/20]="selectedRole() === role.value"
          [class.border-gray-200]="selectedRole() !== role.value"
          [class.dark:border-gray-700]="selectedRole() !== role.value"
        >
          <p class="font-semibold text-gray-900 dark:text-white">{{ role.label }}</p>
          <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">{{ role.description }}</p>
        </button>
      }
    </div>

    <div class="mt-8 flex justify-end">
      <button
        type="button"
        (click)="submit()"
        [disabled]="!selectedRole() || isSubmitting()"
        class="px-6 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium disabled:opacity-50"
      >
        {{ isSubmitting() ? 'Submitting...' : 'Submit For Approval' }}
      </button>
    </div>
  </div>
</section>
