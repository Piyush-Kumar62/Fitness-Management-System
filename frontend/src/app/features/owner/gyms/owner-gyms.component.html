<section class="dashboard-page space-y-6">
  <article class="glass-card p-6 rounded-2xl border border-white/20">
    <h1 class="text-2xl font-bold text-white">Gyms</h1>
    <p class="text-gray-200 mt-2">Create and manage gym branches for your owner account.</p>
  </article>

  <article class="glass-card p-6 rounded-2xl border border-white/20 space-y-4">
    <h2 class="text-xl font-semibold text-white">Add New Gym</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <input
        [(ngModel)]="form.name"
        placeholder="Gym name"
        class="rounded-lg bg-white/10 border border-white/20 text-white placeholder:text-gray-300 px-3 py-2"
      />
      <input
        [(ngModel)]="form.address"
        placeholder="Address"
        class="rounded-lg bg-white/10 border border-white/20 text-white placeholder:text-gray-300 px-3 py-2"
      />
      <input
        [(ngModel)]="form.contact"
        placeholder="Contact"
        class="rounded-lg bg-white/10 border border-white/20 text-white placeholder:text-gray-300 px-3 py-2"
      />
    </div>
    <button
      (click)="createGym()"
      [disabled]="isSubmitting()"
      class="px-4 py-2 rounded-lg bg-fuchsia-500 hover:bg-fuchsia-600 text-white font-semibold disabled:opacity-60"
    >
      {{ isSubmitting() ? 'Creating...' : 'Create Gym' }}
    </button>
  </article>

  <article class="glass-card p-6 rounded-2xl border border-white/20">
    <h2 class="text-xl font-semibold text-white mb-4">My Gyms</h2>
    @if (isLoading()) {
      <p class="text-gray-200">Loading gyms...</p>
    } @else if (gyms().length === 0) {
      <p class="text-gray-200">No gyms found. Create your first gym above.</p>
    } @else {
      <div class="space-y-3">
        @for (gym of gyms(); track gym.id) {
          <div class="flex items-center justify-between rounded-xl border border-white/15 p-4">
            <div>
              <p class="text-white font-semibold">{{ gym.name }}</p>
              <p class="text-gray-300 text-sm">Gym ID: {{ gym.id }}</p>
            </div>
            <button
              (click)="deleteGym(gym.id)"
              class="px-3 py-1.5 rounded-lg bg-red-500/80 hover:bg-red-600 text-white text-sm"
            >
              Delete
            </button>
          </div>
        }
      </div>
    }
  </article>
</section>
