<div
  class="ai-message"
  [class.from-user]="message.sender === 'USER'"
  [class.from-assistant]="message.sender === 'ASSISTANT'"
  [class.from-tool]="message.sender === 'TOOL'"
  [class.from-error]="message.sender === 'ERROR'"
>
  <div class="ai-avatar" aria-hidden="true">
    @switch (message.sender) {
      @case ('USER') { U }
      @case ('ASSISTANT') { AI }
      @case ('TOOL') { TL }
      @case ('ERROR') { ! }
      @default { * }
    }
  </div>

  <div class="ai-bubble">
    @if (message.sender === 'ASSISTANT') {
      <div class="ai-markdown" [innerHTML]="renderedHtml"></div>
    } @else {
      <p>{{ message.content }}</p>
    }
    @if (message.streaming) {
      <span class="ai-streaming">Streaming...</span>
    }
  </div>

  <button
    type="button"
    class="ai-copy"
    (click)="copyMessage()"
    aria-label="Copy message"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2M16 8h2a2 2 0 012 2v8a2 2 0 01-2 2h-8a2 2 0 01-2-2v-2"
      />
    </svg>
  </button>
</div>
