<div class="app-shell min-h-screen flex flex-col">
  <app-landing-navbar></app-landing-navbar>

  <main class="auth-main mt-16 flex-1 px-4 sm:px-6 lg:px-8 flex items-center justify-center py-8">
    <div class="max-w-6xl mx-auto w-full auth-shell-card">
      <div class="grid grid-cols-1 xl:grid-cols-2">
        <aside class="hidden xl:flex p-7 2xl:p-8 flex-col justify-between border-r border-slate-200 dark:border-white/15">
          <div>
            <p
              class="inline-flex items-center rounded-full border border-pink-500/30 dark:border-white/20 bg-pink-50 dark:bg-white/10 px-3 py-1 text-xs font-medium uppercase tracking-wide text-pink-600 dark:text-pink-200"
            >
              {{ content.brand.name }} Platform
            </p>
            <h2 class="mt-4 text-4xl font-bold text-slate-900 dark:text-white leading-tight">
              Build your gym operations in one secure workspace.
            </h2>
            <p class="mt-3 text-slate-600 dark:text-gray-200">
              Manage classes, trainers, plans, and memberships with role-based dashboards.
            </p>
          </div>

          <img
            src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1200&q=80"

            class="mt-10 flex-1 min-h-0 w-full rounded-2xl object-cover border border-slate-200 dark:border-white/15 shadow-2xl"
            loading="lazy"
          />
        </aside>

        <section class="p-4 sm:p-6 lg:p-7 flex items-center justify-center">
          <div class="w-full max-w-md">
            <router-outlet></router-outlet>
          </div>
        </section>
      </div>
    </div>

</div>
